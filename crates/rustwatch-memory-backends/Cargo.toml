[package]
name = "rustwatch-memory-backends"
description = "LanceDB + SurrealDB backends for rustwatch memory (optional heavy deps)"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Chophe"]

[dependencies]
anyhow = "1"
arrow-array = "53"
arrow-schema = "53"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lancedb = "0.17"
rustwatch-core = { path = "../rustwatch-core" }
rustwatch-memory = { path = "../rustwatch-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "2", default-features = false, features = ["kv-mem"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
